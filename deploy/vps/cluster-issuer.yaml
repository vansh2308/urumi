# Let's Encrypt for every Ingress annotated `cert-manager.io/cluster-issuer: letsencrypt`.
# HTTP-01 challenges are answered through k3s's Traefik. Set your email, then:
#   kubectl apply -f deploy/vps/cluster-issuer.yaml
# Try `server: https://acme-staging-v02.api.letsencrypt.org/directory` first to avoid rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
