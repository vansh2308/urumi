# Environment-neutral defaults for the Urumi services. Layer an environment file on top:
#   values-local.yaml       k3d cluster on a laptop (urumi-local)
#   values-production.yaml  single-node k3s on a VPS (template; fill in hosts and secrets)
#
# Names are pinned with fullnameOverride so in-cluster DNS is stable:
#   woocommerce-mcp.<ns>.svc.cluster.local:8000   (private: only the gateway may connect)
#   gateway.<ns>.svc.cluster.local:8100
#   agent.<ns>.svc.cluster.local:8201
#   frontend.<ns>.svc.cluster.local:8080
#
# Secrets are never stored here. Each service reads its credentials from a Secret created out of
# band (deploy/scripts/create-local-secrets.sh locally, your secret manager in production):
#   woocommerce-mcp-secrets: WC_CONSUMER_KEY, WC_CONSUMER_SECRET, DB_URL
#   gateway-secrets:         DB_URL, AUTH_TOKEN_PEPPER, UPSTREAM_CREDENTIAL_KEYS
#   agent-secrets:           DB_URL, GEMINI_API_KEY

global:
  # One immutable tag (e.g. the git SHA) for every image; a component's image.tag overrides it.
  imageTag: ""

# --- WooCommerce MCP server ----------------------------------------------------------------------
woocommerce-mcp:
  enabled: true
  nameOverride: woocommerce-mcp
  fullnameOverride: woocommerce-mcp
  component: mcp-server
  image:
    repository: urumi/woocommerce-mcp
  containerPort: 8000
  service:
    port: 8000
  terminationGracePeriodSeconds: 35
  env:
    LOG_FORMAT: json
    LOG_LEVEL: INFO
    MCP_HOST: 0.0.0.0
    MCP_PORT: "8000"
    MCP_SHUTDOWN_GRACE_SECONDS: "25"
    # DNS-rebinding protection: the Host headers the gateway (and port-forwards) send.
    MCP_ALLOWED_HOSTS: >-
      woocommerce-mcp:*,woocommerce-mcp.urumi:*,woocommerce-mcp.urumi.svc:*,woocommerce-mcp.urumi.svc.cluster.local:*,localhost:*,127.0.0.1:*
    # An upstream store outage must not pull every replica out of the Service.
    MCP_READINESS_CHECKS_WOOCOMMERCE: "false"
    WC_IP_FAMILY: auto
    # WC_BASE_URL and WC_ALLOW_INSECURE_HTTP are per environment.
  secretEnv:
    - { name: WC_CONSUMER_KEY, secretName: woocommerce-mcp-secrets }
    - { name: WC_CONSUMER_SECRET, secretName: woocommerce-mcp-secrets }
    - { name: DB_URL, secretName: woocommerce-mcp-secrets }
  probes:
    liveness: { path: /healthz }
    readiness: { path: /readyz }
    startup: { path: /healthz, periodSeconds: 2, failureThreshold: 30 }
  migration:
    enabled: true
  networkPolicy:
    enabled: true
    # The MCP server does no client authentication of its own: only gateway pods may reach it.
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: gateway

# --- Gateway --------------------------------------------------------------------------------------
gateway:
  enabled: true
  nameOverride: gateway
  fullnameOverride: gateway
  component: gateway
  image:
    repository: urumi/gateway
  containerPort: 8100
  service:
    port: 8100
  env:
    LOG_FORMAT: json
    LOG_LEVEL: INFO
    GATEWAY_HOST: 0.0.0.0
    GATEWAY_PORT: "8100"
    GATEWAY_SHUTDOWN_GRACE_SECONDS: "25"
    # Connector URLs must match (SSRF guard). Plain HTTP is fine inside the cluster network.
    UPSTREAM_ALLOWED_HOSTS: woocommerce-mcp.urumi.svc.cluster.local:8000
    UPSTREAM_ALLOW_INSECURE_HTTP: "true"
    UPSTREAM_IP_FAMILY: auto
    # Hosted MCP servers (see hostedMcp below; the namespace must match hostedMcp.namespace).
    HOSTED_ENABLED: "true"
    HOSTED_NAMESPACE: urumi-mcp
    HOSTED_GATEWAY_NAMESPACE: urumi
    HOSTED_GATEWAY_POD_LABEL: app.kubernetes.io/name=gateway
    # Only these images can be deployed by an admin (fnmatch patterns). Pin digests in production.
    HOSTED_ALLOWED_IMAGES: >-
      ghcr.io/github/github-mcp-server:*,mcp/duckduckgo:*
    HOSTED_MAX_SERVERS: "10"
  secretEnv:
    - { name: DB_URL, secretName: gateway-secrets }
    - { name: AUTH_TOKEN_PEPPER, secretName: gateway-secrets }
    # Encrypts connector credentials at rest. Optional: without it credentials are refused.
    - { name: UPSTREAM_CREDENTIAL_KEYS, secretName: gateway-secrets, optional: true }
  # The gateway's token is used only for its Role in the hosted namespace (templates/hosted-mcp).
  serviceAccount:
    automountToken: true
  migration:
    enabled: true
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: frontend
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: agent

# --- Hosted MCP servers ----------------------------------------------------------------------------
# Namespace, quota, default-deny NetworkPolicy and the gateway's Role for MCP servers that admins
# deploy from container images through the gateway (templates/hosted-mcp.yaml).
hostedMcp:
  enabled: true
  namespace: urumi-mcp
  # Ceiling for every hosted server together.
  quota:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    services: "10"
    secrets: "20"
  # Defaults for containers that do not set their own (the gateway always does).
  limitRange:
    default: { cpu: 250m, memory: 256Mi }
    defaultRequest: { cpu: 50m, memory: 64Mi }
    max: { cpu: "1", memory: 1Gi }

# --- Agent ----------------------------------------------------------------------------------------
agent:
  enabled: true
  nameOverride: agent
  fullnameOverride: agent
  component: agent
  image:
    repository: urumi/agent
  containerPort: 8201
  service:
    port: 8201
  # Streaming runs may take up to RUN_TIMEOUT_SECONDS; give them time to finish on shutdown.
  terminationGracePeriodSeconds: 45
  env:
    LOG_FORMAT: json
    LOG_LEVEL: INFO
    AGENT_HOST: 0.0.0.0
    AGENT_PORT: "8201"
    AGENT_SHUTDOWN_GRACE_SECONDS: "30"
    # Tools are discovered and invoked only through the gateway, with the caller's own key.
    GATEWAY_URL: http://gateway.urumi.svc.cluster.local:8100
    LLM_PROVIDER: gemini
    LLM_MODEL: gemini-3.8-flash
  secretEnv:
    - { name: DB_URL, secretName: agent-secrets }
    - { name: GEMINI_API_KEY, secretName: agent-secrets }
  migration:
    enabled: true
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: frontend

# --- Dashboard ------------------------------------------------------------------------------------
frontend:
  enabled: true
  nameOverride: frontend
  fullnameOverride: frontend
  component: frontend
  image:
    repository: urumi/frontend
  containerPort: 8080
  service:
    port: 8080
  terminationGracePeriodSeconds: 15
  env:
    # nginx resolves these per request (fully qualified: nginx ignores DNS search domains).
    GATEWAY_UPSTREAM: http://gateway.urumi.svc.cluster.local:8100
    AGENT_UPSTREAM: http://agent.urumi.svc.cluster.local:8201
  probes:
    liveness: { path: /healthz }
    readiness: { path: /healthz }
    startup: { path: /healthz, periodSeconds: 2, failureThreshold: 15 }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  # nginx writes its rendered config, pid file and proxy buffers; the image is read-only.
  writableDirs:
    - /tmp
    - /var/cache/nginx
    - /etc/nginx/conf.d
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
