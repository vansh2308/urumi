[project]
name = "agent"
version = "0.1.0"
description = "Single-agent LLM tool-calling service that discovers and invokes tools through the gateway"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Urumi" }]
dependencies = [
    "fastapi>=0.118,<1.0",
    "uvicorn>=0.35,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.16,<2.0",
    "prometheus-client>=0.22,<1.0",
    "jsonschema>=4.25,<5.0",
]

[project.scripts]
agent = "agent.__main__:main"

[tool.poetry]
packages = [{ include = "agent", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
pytest-asyncio = "^1.1"
ruff = "^0.13"
mypy = "^1.18"
types-jsonschema = "^4.25"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "N", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["N999"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Security"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
