{{- if .Values.setup.runId }}
# Activates WooCommerce, sets permalinks, country/currency and Cash on delivery, and installs the
# REST key the provisioner generated (store-setup.sh in the store image). Idempotent; a new run id
# gives a new Job, because a Job's pod template cannot be changed.
apiVersion: batch/v1
kind: Job
metadata:
  name: store-setup-{{ .Values.setup.runId }}
  labels:
    {{- include "urumi-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: store-setup
spec:
  backoffLimit: {{ .Values.setup.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.setup.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: store-setup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        # Group 0 like the Bitnami image itself: its tree is group-writable, and WP-CLI writes
        # its own wp-config.php there (the container layer, not the volume).
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: {{ include "urumi-store.wordpressImage" . }}
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          command: ["/opt/urumi/store-setup.sh"]
          env:
            - { name: DB_HOST, value: {{ printf "%s-mariadb" .Release.Name | quote }} }
            - { name: DB_PORT, value: "3306" }
            - { name: DB_NAME, value: {{ .Values.wordpress.mariadb.auth.database | quote }} }
            - { name: DB_USER, value: {{ .Values.wordpress.mariadb.auth.username | quote }} }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.credentials }}, key: mariadb-password }
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.mcp }}, key: WC_CONSUMER_KEY }
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.mcp }}, key: WC_CONSUMER_SECRET }
            - { name: WP_ADMIN_USER, value: {{ .Values.wordpress.wordpressUsername | quote }} }
            - { name: STORE_NAME, value: {{ .Values.store.name | default .Values.wordpress.wordpressBlogName | quote }} }
            - { name: STORE_COUNTRY, value: {{ .Values.store.country | quote }} }
            - { name: STORE_CURRENCY, value: {{ .Values.store.currency | quote }} }
            - { name: SEED_DEMO, value: {{ .Values.setup.seedDemo | toString | quote }} }
            - { name: WAIT_SECONDS, value: {{ .Values.setup.waitSeconds | toString | quote }} }
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
{{- end }}
