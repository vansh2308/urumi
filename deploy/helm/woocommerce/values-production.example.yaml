# The store (Bitnami WordPress + MariaDB, release `store`) on a VPS. Copy to
# values-production.secret.yaml (gitignored), set the domain and passwords, then:
#   helm upgrade --install store oci://registry-1.docker.io/bitnamicharts/wordpress \
#     --version <pinned chart version> -n urumi -f values-production.secret.yaml --atomic --wait
# docs/vps.md covers backups before upgrades.
wordpressHost: "shop.example.com"
wordpressScheme: https

wordpressUsername: admin
wordpressPassword: "change-me"
wordpressEmail: "admin@example.com"
wordpressBlogName: "Urumi Store"

service:
  type: ClusterIP

ingress:
  enabled: true
  ingressClassName: traefik
  hostname: shop.example.com
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

persistence:
  enabled: true
  storageClass: local-path  # k3s default; use your provider's class elsewhere
  size: 10Gi
  annotations:
    helm.sh/resource-policy: keep

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 1Gi }

mariadb:
  enabled: true
  auth:
    rootPassword: "change-me"
    username: bn_wordpress
    password: "change-me"
    database: bitnami_wordpress
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi
