[project]
name = "gateway"
version = "0.1.0"
description = "Platform API gateway: auth, teams, API keys, MCP connector registry and authorized tool routing"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Urumi" }]
dependencies = [
    "fastapi>=0.118,<1.0",
    "uvicorn>=0.35,<1.0",
    "mcp>=1.20,<2.0",
    "httpx>=0.28,<1.0",
    "pydantic[email]>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.16,<2.0",
    "argon2-cffi>=25.1,<26.0",
    "prometheus-client>=0.22,<1.0",
]

[project.scripts]
gateway = "gateway.__main__:main"
gateway-admin = "gateway.cli:main"

[tool.poetry]
packages = [{ include = "gateway", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
pytest-asyncio = "^1.1"
ruff = "^0.13"
mypy = "^1.18"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "N", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["N999"]
"tests/**" = ["S101", "S105", "S106", "PLR0911"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Security"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
