{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "urumi-service.fullname" . }}
  labels:
    {{- include "urumi-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "urumi-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    {{- range .Values.networkPolicy.ingress }}
    - {{- with .from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        {{- if .ports }}
        {{- toYaml .ports | nindent 8 }}
        {{- else }}
        - port: http
          protocol: TCP
        {{- end }}
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
